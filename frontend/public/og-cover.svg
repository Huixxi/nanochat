<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#000"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.5" fill="#fff" opacity="0.03"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Center glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="30%">
    <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Connection arcs -->
  <path d="M 450 315 Q 600 260 750 315" stroke="#a1a1aa" stroke-width="1.5" opacity="0.2"/>
  <path d="M 450 315 Q 600 370 750 315" stroke="#d4d4d8" stroke-width="1.5" opacity="0.2"/>
  <!-- Nodes -->
  <circle cx="450" cy="315" r="40" fill="none" stroke="#a1a1aa" stroke-width="2" opacity="0.3"/>
  <circle cx="450" cy="315" r="50" fill="none" stroke="#a1a1aa" stroke-width="0.5" opacity="0.1"/>
  <circle cx="750" cy="315" r="40" fill="none" stroke="#d4d4d8" stroke-width="2" opacity="0.3"/>
  <circle cx="750" cy="315" r="50" fill="none" stroke="#d4d4d8" stroke-width="0.5" opacity="0.1"/>
  <!-- Center convergence -->
  <circle cx="600" cy="295" r="6" fill="#fff" opacity="0.08"/>
  <!-- Brand -->
  <text x="600" y="500" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" opacity="0.9">µChat</text>
  <text x="600" y="545" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="20" opacity="0.6">亚熟人社交，从信任开始</text>
  <!-- Decorative line -->
  <line x1="550" y1="510" x2="650" y2="510" stroke="#71717a" stroke-width="1" opacity="0.3"/>
</svg>
