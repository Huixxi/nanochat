<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoChat - Avatar Builder</title>
    <style>
        :root {
            --bg: #000;
            --surface: #111;
            --border: #222;
            --text: #fff;
            --text-dim: #666;
            --accent: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 60px 24px;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; text-align: center; }
        .sub { text-align: center; color: var(--text-dim); font-size: 14px; margin: 8px 0 48px; }

        .layout { display: grid; grid-template-columns: 240px 1fr; gap: 48px; align-items: start; }
        @media (max-width: 640px) { .layout { grid-template-columns: 1fr; } }

        .preview { position: sticky; top: 60px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .canvas {
            width: 200px; height: 200px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .canvas svg { position: absolute; width: 100%; height: 100%; }

        .config-out {
            font: 11px/1.5 'SF Mono', monospace;
            color: var(--text-dim);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            width: 200px;
            word-break: break-all;
        }

        .export {
            padding: 10px 24px;
            background: var(--accent);
            border: none; border-radius: 8px;
            color: #fff; font-size: 13px; font-weight: 500;
            cursor: pointer;
        }
        .export:active { opacity: 0.8; }

        .controls { display: flex; flex-direction: column; gap: 28px; }
        .section label {
            display: block; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-dim); margin-bottom: 8px;
        }
        .row { display: flex; gap: 6px; flex-wrap: wrap; }
        .opt {
            width: 48px; height: 48px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s;
        }
        .opt:hover { border-color: #444; }
        .opt.on { border-color: var(--accent); }
        .opt svg { width: 32px; height: 32px; color: #888; }
        .opt.on svg { color: var(--accent); }

        .color-row { display: flex; gap: 8px; }
        .cdot {
            width: 28px; height: 28px; border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer; transition: border-color 0.15s;
        }
        .cdot.on { border-color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <h1>Avatar Builder</h1>
    <p class="sub">选择组件，组合你的形象</p>

    <div class="layout">
        <div class="preview">
            <div class="canvas" id="canvas">
                <svg viewBox="0 0 200 200" id="L-face"></svg>
                <svg viewBox="0 0 200 200" id="L-ears"></svg>
                <svg viewBox="0 0 200 200" id="L-eyebrows"></svg>
                <svg viewBox="0 0 200 200" id="L-eyes"></svg>
                <svg viewBox="0 0 200 200" id="L-mouth"></svg>
                <svg viewBox="0 0 200 200" id="L-facial"></svg>
                <svg viewBox="0 0 200 200" id="L-hair"></svg>
                <svg viewBox="0 0 200 200" id="L-acc"></svg>
            </div>
            <button class="export" onclick="copy()">Copy Config</button>
            <div class="config-out" id="out"></div>
        </div>

        <div class="controls" id="ctrls"></div>
    </div>
</div>

<script>
const C = {
    face: 'round',
    hair: 'side-part',
    hairColor: '#fafafa',
    eyebrows: 'natural',
    eyes: 'round',
    mouth: 'smile',
    ears: 'normal',
    facialHair: 'none',
    accessory: 'none'
};

const PARTS = {
    face: [
        {id:'round', d:'M 40 110 A 60 65 0 1 1 160 110 A 60 65 0 1 1 40 110'},
        {id:'square', d:'M 45 50 Q 45 35 60 35 L 140 35 Q 155 35 155 50 L 155 160 Q 155 175 140 175 L 60 175 Q 45 175 45 160 Z'},
        {id:'oval', d:'M 100 40 Q 155 55 155 110 Q 150 175 100 180 Q 50 175 45 110 Q 45 55 100 40'},
        {id:'heart', d:'M 100 45 Q 150 45 158 100 Q 155 160 100 185 Q 45 160 42 100 Q 50 45 100 45'}
    ],
    hair: [
        {id:'short', p:['M 42 90 Q 45 40 100 30 Q 155 40 158 90']},
        {id:'buzz', p:['M 48 85 Q 50 50 100 42 Q 150 50 152 85']},
        {id:'side-part', p:['M 48 82 Q 50 45 100 36 Q 150 45 152 82','M 65 50 Q 70 38 100 36 Q 135 38 140 48','M 65 50 Q 55 55 50 70']},
        {id:'undercut', p:['M 50 80 Q 55 45 100 38 Q 145 45 150 80','M 55 55 Q 60 42 100 38 Q 130 40 120 58']},
        {id:'spiky', p:['M 50 78 Q 55 48 100 40 Q 145 48 150 78','M 65 48 L 70 30 L 80 50','M 90 42 L 100 22 L 110 42','M 120 48 L 130 30 L 135 50']},
        {id:'messy', p:['M 45 85 Q 50 42 100 32 Q 150 42 155 85','M 55 52 Q 48 45 52 38','M 80 38 Q 85 28 90 35','M 110 36 Q 115 26 120 34','M 140 48 Q 148 42 145 36']},
        {id:'slick-back', p:['M 45 85 Q 50 42 100 34 Q 150 42 155 85','M 60 60 Q 80 42 100 38 Q 120 42 140 60']},
        {id:'mohawk', p:['M 55 78 Q 58 55 100 50 Q 142 55 145 78','M 85 50 Q 88 20 100 15 Q 112 20 115 50']},
        {id:'long-straight', p:['M 42 90 Q 45 40 100 30 Q 155 40 158 90','M 42 90 Q 38 120 35 160','M 158 90 Q 162 120 165 160']},
        {id:'curly', p:['M 42 90 Q 45 40 100 30 Q 155 40 158 90','M 42 90 Q 35 105 40 120 Q 45 135 38 150','M 158 90 Q 165 105 160 120 Q 155 135 162 150']},
        {id:'bun', p:['M 42 90 Q 45 40 100 30 Q 155 40 158 90'], c:{cx:100,cy:22,r:16}},
        {id:'bangs', p:['M 42 90 Q 45 40 100 30 Q 155 40 158 90','M 55 75 L 60 55 L 72 78 L 80 52 L 92 75 L 100 50 L 108 75']},
        {id:'wolf-cut', p:['M 42 88 Q 45 40 100 30 Q 155 40 158 88','M 42 88 Q 38 105 40 120 Q 42 130 38 140','M 158 88 Q 162 105 160 120 Q 158 130 162 140']},
        {id:'braids', p:['M 42 90 Q 45 40 100 30 Q 155 40 158 90','M 42 90 Q 40 110 42 130 Q 44 145 40 160','M 158 90 Q 160 110 158 130 Q 156 145 160 160']},
        {id:'bald', p:[]}
    ],
    eyebrows: [
        {id:'natural', p:['M 58 88 Q 72 84 82 87','M 118 87 Q 128 84 142 88']},
        {id:'thick', p:['M 56 88 Q 70 82 84 86','M 116 86 Q 130 82 144 88'], w:4},
        {id:'arched', p:['M 58 90 Q 68 80 82 86','M 118 86 Q 132 80 142 90']},
        {id:'straight', p:['M 58 88 L 84 87','M 116 87 L 142 88'], w:3},
        {id:'angry', p:['M 58 84 Q 70 88 84 92','M 116 92 Q 130 88 142 84'], w:3},
        {id:'none', p:[]}
    ],
    eyes: [
        {id:'round', circles:[{cx:72,cy:105,r:7},{cx:128,cy:105,r:7}]},
        {id:'almond', ellipses:[{cx:72,cy:105,rx:9,ry:5},{cx:128,cy:105,rx:9,ry:5}]},
        {id:'narrow', p:['M 62 105 Q 72 98 82 105','M 118 105 Q 128 98 138 105']},
        {id:'happy', p:['M 62 108 Q 72 100 82 108','M 118 108 Q 128 100 138 108']},
        {id:'star', p:['M 72 98 L 74 103 L 79 103 L 75 107 L 77 112 L 72 109 L 67 112 L 69 107 L 65 103 L 70 103 Z','M 128 98 L 130 103 L 135 103 L 131 107 L 133 112 L 128 109 L 123 112 L 125 107 L 121 103 L 126 103 Z'], fill:true},
        {id:'cat', p:['M 62 105 Q 67 98 72 105 Q 77 98 82 105','M 118 105 Q 123 98 128 105 Q 133 98 138 105']}
    ],
    mouth: [
        {id:'smile', p:['M 82 135 Q 100 148 118 135']},
        {id:'flat', p:['M 85 138 L 115 138']},
        {id:'laugh', p:['M 80 132 Q 100 155 120 132']},
        {id:'pout', p:['M 92 132 A 8 6 0 1 1 108 132 A 8 6 0 1 1 92 132']},
        {id:'calm', p:['M 88 138 Q 100 142 112 138']}
    ],
    ears: [
        {id:'normal', p:['M 40 100 Q 35 95 36 105 Q 37 115 40 112','M 160 100 Q 165 95 164 105 Q 163 115 160 112']},
        {id:'elf', p:['M 40 105 Q 28 85 35 75 Q 38 95 40 100','M 160 105 Q 172 85 165 75 Q 162 95 160 100']},
        {id:'small', circles:[{cx:38,cy:105,r:4},{cx:162,cy:105,r:4}]},
        {id:'earring', p:['M 40 100 Q 35 95 36 105 Q 37 115 40 112','M 160 100 Q 165 95 164 105 Q 163 115 160 112'], circles:[{cx:37,cy:118,r:3},{cx:163,cy:118,r:3}]}
    ],
    facialHair: [
        {id:'none', p:[]},
        {id:'stubble', dots:[{x:85,y:148},{x:92,y:152},{x:100,y:150},{x:108,y:152},{x:115,y:148},{x:88,y:156},{x:96,y:158},{x:104,y:158},{x:112,y:156}]},
        {id:'mustache', p:['M 82 130 Q 90 135 100 133 Q 110 135 118 130']},
        {id:'goatee', p:['M 90 148 Q 100 155 110 148','M 92 152 Q 100 162 108 152']},
        {id:'full-beard', p:['M 82 130 Q 90 135 100 133 Q 110 135 118 130','M 72 128 Q 70 145 80 158 Q 100 172 120 158 Q 130 145 128 128']}
    ],
    accessory: [
        {id:'none', p:[]},
        {id:'glasses', circles:[{cx:72,cy:105,r:14},{cx:128,cy:105,r:14}], p:['M 86 105 Q 100 110 114 105']},
        {id:'hat', p:['M 55 55 Q 60 25 100 20 Q 140 25 145 55','M 45 55 L 155 55']},
        {id:'headphones', p:['M 42 105 Q 40 60 100 50 Q 160 60 158 105'], rects:[{x:34,y:98,w:12,h:20},{x:154,y:98,w:12,h:20}]}
    ]
};

const COLORS = ['#fafafa','#1a1a2e','#8b4513','#daa520','#dc143c','#4169e1','#8b5cf6','#059669'];

function init() {
    const ctrls = document.getElementById('ctrls');
    const sections = [
        ['face','脸型'],['hair','发型'],['hairColor','颜色'],['eyebrows','眉毛'],
        ['eyes','眼睛'],['mouth','嘴巴'],['ears','耳朵'],['facialHair','胡须'],['accessory','配饰']
    ];

    sections.forEach(([key, label]) => {
        const sec = document.createElement('div');
        sec.className = 'section';
        sec.innerHTML = `<label>${label}</label>`;
        const row = document.createElement('div');
        row.className = key === 'hairColor' ? 'color-row' : 'row';

        if (key === 'hairColor') {
            COLORS.forEach(c => {
                const d = document.createElement('div');
                d.className = 'cdot' + (c === C.hairColor ? ' on' : '');
                d.style.background = c;
                d.onclick = () => { C.hairColor = c; refresh(); render(); };
                row.appendChild(d);
            });
        } else {
            PARTS[key].forEach(part => {
                const btn = document.createElement('div');
                btn.className = 'opt' + (C[key] === part.id ? ' on' : '');
                btn.dataset.key = key;
                btn.dataset.id = part.id;
                btn.innerHTML = miniSVG(key, part);
                btn.onclick = () => { C[key] = part.id; refresh(); render(); };
                row.appendChild(btn);
            });
        }
        sec.appendChild(row);
        ctrls.appendChild(sec);
    });
    render();
    showConfig();
}

function miniSVG(key, part) {
    let inner = '';
    const s = 'stroke="#888" fill="none" stroke-width="2.5" stroke-linecap="round"';
    if (part.d) inner = `<path d="${part.d}" ${s}/>`;
    else if (part.p) part.p.forEach(d => { inner += `<path d="${d}" ${s} stroke-linejoin="round"/>`; });
    if (part.circles) part.circles.forEach(c => { inner += `<circle cx="${c.cx}" cy="${c.cy}" r="${c.r}" fill="#888" stroke="none"/>`; });
    if (part.ellipses) part.ellipses.forEach(e => { inner += `<ellipse cx="${e.cx}" cy="${e.cy}" rx="${e.rx}" ry="${e.ry}" fill="#888"/>`; });
    if (part.c) inner += `<circle cx="${part.c.cx}" cy="${part.c.cy}" r="${part.c.r}" ${s}/>`;
    if (part.dots) part.dots.slice(0,5).forEach(d => { inner += `<circle cx="${d.x}" cy="${d.y}" r="2" fill="#888"/>`; });
    if (part.fill && part.p) { inner = ''; part.p.forEach(d => { inner += `<path d="${d}" fill="#888" stroke="none"/>`; }); }
    if (!inner) inner = `<line x1="70" y1="70" x2="130" y2="130" stroke="#444" stroke-width="2"/><line x1="130" y1="70" x2="70" y2="130" stroke="#444" stroke-width="2"/>`;
    return `<svg viewBox="0 0 200 200">${inner}</svg>`;
}

function refresh() {
    document.querySelectorAll('.opt').forEach(el => {
        el.classList.toggle('on', C[el.dataset.key] === el.dataset.id);
    });
    document.querySelectorAll('.cdot').forEach((el, i) => {
        el.classList.toggle('on', COLORS[i] === C.hairColor);
    });
    showConfig();
}

function render() {
    const col = C.hairColor;
    const layers = {
        'L-face': () => { const f = PARTS.face.find(x=>x.id===C.face); return f ? path(f.d, col) : ''; },
        'L-ears': () => drawPart(PARTS.ears, C.ears, col),
        'L-eyebrows': () => { const b = PARTS.eyebrows.find(x=>x.id===C.eyebrows); if(!b||!b.p.length) return ''; return b.p.map(d=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${b.w||2.5}" stroke-linecap="round"/>`).join(''); },
        'L-eyes': () => { const e = PARTS.eyes.find(x=>x.id===C.eyes); if(!e) return ''; let r=''; if(e.circles) e.circles.forEach(c=>{r+=`<circle cx="${c.cx}" cy="${c.cy}" r="${c.r}" fill="${col}"/>`;}); if(e.ellipses) e.ellipses.forEach(c=>{r+=`<ellipse cx="${c.cx}" cy="${c.cy}" rx="${c.rx}" ry="${c.ry}" fill="${col}"/>`;}); if(e.p) e.p.forEach(d=>{r+=`<path d="${d}" fill="${e.fill?col:'none'}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`;}); return r; },
        'L-mouth': () => { const m = PARTS.mouth.find(x=>x.id===C.mouth); if(!m) return ''; return m.p.map(d=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`).join(''); },
        'L-facial': () => { const f = PARTS.facialHair.find(x=>x.id===C.facialHair); if(!f) return ''; let r=''; if(f.p) f.p.forEach(d=>{r+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;}); if(f.dots) f.dots.forEach(d=>{r+=`<circle cx="${d.x}" cy="${d.y}" r="1.5" fill="${col}" opacity="0.5"/>`;}); return r; },
        'L-hair': () => { const h = PARTS.hair.find(x=>x.id===C.hair); if(!h) return ''; let r=''; h.p.forEach(d=>{r+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;}); if(h.c) r+=`<circle cx="${h.c.cx}" cy="${h.c.cy}" r="${h.c.r}" fill="none" stroke="${col}" stroke-width="3"/>`; return r; },
        'L-acc': () => drawPart(PARTS.accessory, C.accessory, col)
    };
    Object.entries(layers).forEach(([id, fn]) => { document.getElementById(id).innerHTML = fn(); });
}

function drawPart(arr, id, col) {
    const part = arr.find(x=>x.id===id);
    if(!part) return '';
    let r = '';
    if(part.p) part.p.forEach(d=>{r+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`; });
    if(part.circles) part.circles.forEach(c=>{r+=`<circle cx="${c.cx}" cy="${c.cy}" r="${c.r}" fill="${part.p?col:'none'}" stroke="${col}" stroke-width="2.5"/>`; });
    if(part.rects) part.rects.forEach(d=>{r+=`<rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="4" fill="none" stroke="${col}" stroke-width="2.5"/>`; });
    return r;
}

function path(d, col) { return `<path d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`; }

function showConfig() { document.getElementById('out').textContent = JSON.stringify(C, null, 1); }

function copy() {
    navigator.clipboard.writeText(JSON.stringify(C)).then(()=>{
        const btn = document.querySelector('.export');
        btn.textContent = 'Copied'; setTimeout(()=>btn.textContent='Copy Config',1200);
    });
}

init();
</script>
</body>
</html>
